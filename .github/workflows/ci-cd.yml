name: CI/CD

# Master builds run on the self-hosted runner registered for this repository.
# Pull requests run on GitHub-hosted runners so forked code never executes on that machine.
# GitHub Pages is served from the docs folder on master.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-pull-request:
    name: Verify pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: node scripts/ci.mjs

  build-and-publish:
    name: Build and publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: node scripts/ci.mjs
        env:
          CHROME_BIN: C:\Program Files\Google\Chrome\Application\chrome.exe

      - name: Publish GitHub Pages
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish-github-pages.ps1
